name: Game quality checks

on:
  push:
    branches:
      - main
      - feature/gameplay-progression-garage
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run progression tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
